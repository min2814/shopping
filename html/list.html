<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 목록 (카탈로그 토글 필터)</title>
  <script src="https://kit.fontawesome.com/5c3afda2cc.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="../css/list.css">
  <style>
    .catalog-panel {
      display: none;
      margin: 10px 0;
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #fff
    }

    .catalog-panel.open {
      display: block
    }

    .catalog-panel h3 {
      margin: 0 0 10px;
      font-size: 16px
    }

    .catalog-panel .category-filter label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 6px 12px 6px 0;
      cursor: pointer
    }

    .product-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px
    }

    .product-card {
      border: 1px solid #eee;
      border-radius: 10px;
      padding: 12px;
      background: #fff;
      cursor: pointer
    }

    .product-card img {
      width: 100%;
      height: 160px;
      object-fit: contain
    }

    .product-name {
      margin-top: 8px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .pagination {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin: 20px 0
    }

    .pagination button.active {
      font-weight: 700
    }
  </style>
</head>

<body>
  <header class="top-bar">
    <div class="top-left">
      <div class="delivery-toggle" role="tablist" aria-label="배송 방식">
        <button class="nav-btn active" role="tab" aria-selected="true">Delivery</button>
        <button class="nav-btn" role="tab" aria-selected="false">Pickup</button>
      </div>
      <span class="address">Select the delivery address</span>
      <span class="edit-icon" aria-hidden="true"><i class="fa-regular fa-pen-to-square"></i></span>
      <span class="delivery-time">Nearest delivery : <strong id="delivery-time-text"></strong></span>
    </div>
    <div class="top-right"><span class="phone"><strong>+ 8 800 555-35-35 </strong>Around the clock</span></div>
  </header>

  <!-- 검색/아이콘 -->
  <div class="search-section">
    <button class="catalog-btn" type="button"><i class="fa-regular fa-clone" aria-hidden="true"></i> Catalog</button>
    <div class="search-group">
      <div class="search-pill">
        <select class="category-select" aria-label="카테고리">
          <option>ALL CATEGORIES</option>
        </select>
        <input class="search-input" type="text" placeholder="Search in the market" aria-label="검색어 입력" />
      </div>
      <button class="search-submit" type="button" aria-label="검색"><i class="fa-solid fa-magnifying-glass"
          aria-hidden="true"></i></button>
    </div>
    <div class="icons" aria-label="바로가기 아이콘">
      <!-- 홈 -->
      <div class="icon-box" role="button" tabindex="0" aria-label="배송"><i class="fa-solid fa-house"
          aria-hidden="true"></i></div>

      <!-- 찜 -->
      <div id="wishIcon" class="icon-box" role="button" tabindex="0" aria-label="찜 0개" aria-haspopup="dialog"
        aria-expanded="false">
        <i class="fa-solid fa-heart" aria-hidden="true"></i>
        <span id="wishCount" class="badge" aria-live="polite" aria-atomic="true">0</span>
      </div>

      <!-- 장바구니 -->
      <!-- 교체 (shopping_cart의 미니카트) -->
      <div class="icon-box cart-icon" role="button" tabindex="0" aria-label="장바구니">
        <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
        <span class="cart-badge" id="cart-count">0</span>

        <div class="mini-cart" id="mini-cart" aria-hidden="true">
          <div class="mini-cart__header">
            <strong>Checkout Goods</strong>
            <button class="mini-cart__close" aria-label="닫기">&times;</button>
          </div>

          <ul class="mini-cart__list" id="mini-cart-list"></ul>

          <div class="mini-cart__summary">
            <div class="row"><span>Order Amount</span><span id="mini-order">$0.00</span></div>
            <div class="row"><span>Delivery</span><span id="mini-delivery">$0.00</span></div>
            <div class="row total"><span>Total</span><span id="mini-total">$0.00</span></div>
          </div>

          <div class="mini-cart__actions">
            <button type="button" class="mini-btn ghost" id="mini-view-cart">
              <a href="./shopping_cart.html" class="view_cart">View cart</a></button>
            <button type="button" class="mini-btn primary" id="mini-checkout">Checkout now</button>
          </div>
        </div>
      </div>


      <a id="myPageLink" class="icon-box" href="../html/mypage.html" aria-label="마이페이지">
        <i class="fa-solid fa-user" aria-hidden="true"></i>
      </a>
    </div>
  </div>


  <div id="catalog-panel" class="catalog-panel" role="region" aria-label="카테고리 필터">
    <div class="category-filter" id="category-filter"></div>
  </div>

  <div class="main">
    <div class="content">
      <div class="product-list" id="product-list"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <!-- Wish Popover Panel -->
  <div id="wishBackdrop" class="backdrop" hidden></div>
  <div id="wishPopover" class="wish-popover" aria-hidden="true" role="dialog" aria-labelledby="wishPopTitle" hidden>
    <div class="wish-panel">
      <header class="wish-header">
        <h3 id="wishPopTitle">Wishlist (<span id="wishPopCount">0</span>)</h3>
        <button id="wishPopClose" class="wp-close" aria-label="닫기">×</button>
      </header>
      <ul id="wishPopItems" class="wish-items" role="list"></ul>
      <footer class="wish-footer">
        <div class="wp-sum"><span>Total</span><strong id="wishPopTotal">$0.00</strong></div>
      </footer>
    </div>
  </div>


  <script>
    let products = [];
    let filteredProducts = [];
    const itemsPerPage = 20;
    let currentPage = 1;
    let categories = [];

    async function fetchProducts() {
      try {
        const res = await fetch("https://fakestoreapi.com/products");
        const data = await res.json();

        products = data.map(item => ({
          id: item.id,
          name: item.title,
          price: item.price,
          rating: (item.rating && item.rating.rate) ? item.rating.rate : 0,

          image: item.image,
          category: item.category,
        }));

        categories = ["전체", ...new Set(products.map(p => p.category))];
        createCategoryFilters();
        applyCategoryFilter();
        goToPage(1);
      } catch (err) {
        console.error("상품 데이터를 불러오는 중 오류 발생:", err);
      }
    }

    function createCategoryFilters() {
      const container = document.getElementById("category-filter");
      container.innerHTML = categories.map(cat => `
      <label>
        <input type="checkbox" value="${cat}" ${cat === "전체" ? "checked" : ""} />
        ${cat}
      </label>
    `).join('');
      container.addEventListener('change', applyCategoryFilter);
    }

    function applyCategoryFilter() {
      const checked = Array.from(document.querySelectorAll('#category-filter input:checked'))
        .map(input => input.value);

      if (checked.includes("전체") || checked.length === 0) {
        filteredProducts = products;
      } else {
        filteredProducts = products.filter(p => checked.includes(p.category));
      }
      applySearchFilter();
      goToPage(1);
    }


    function renderProducts(page) {
      const start = (page - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const displayProducts = filteredProducts.slice(start, end);

      const listEl = document.getElementById("product-list");
      listEl.innerHTML = "";

      displayProducts.forEach((p) => {
        const card = document.createElement("div");
        card.className = "product-card";

        // main.js가 쓰는 dataset을 카드에 부여
        card.dataset.id = p.id;
        card.dataset.name = p.name;
        card.dataset.price = p.price;
        card.dataset.image = p.image;

        card.innerHTML = `
        <button class="wishlist-btn" aria-label="찜하기">
          <i class="fa-regular fa-heart"></i>
        </button>
        <div class="img-wrap"><img src="${p.image}" alt="${p.name}"></div>
        <p class="product-name">${p.name}</p>

        <div class="price-row">
          <span class="price">$${Number(p.price).toFixed(2)}</span>
          <button class="add-btn add-to-cart" aria-label="담기" data-id="${p.id}"
            data-name="${p.name.replace(/"/g, '&quot;' )}" data-price="${p.price}" data-image="${p.image}"
            data-category="${p.category}">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <div class="product-rating">⭐ ${p.rating}</div>
        `;


        var img = card.querySelector(".img-wrap img");
        var nameEl = card.querySelector(".product-name");

        function goDetail() {
          localStorage.setItem("selectedProduct", JSON.stringify(p));
          window.location.href = "./detail2.html";
        }

        if (img) {
          img.addEventListener("click", goDetail);
        }
        if (nameEl) {
          nameEl.addEventListener("click", goDetail);
        }


        listEl.appendChild(card);
      });

    }

    function renderPagination() {
      let buttons = '';
      const maxPages = Math.ceil(filteredProducts.length / itemsPerPage);
      for (let i = 1; i <= maxPages; i++) {
        buttons += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }
      document.getElementById("pagination").innerHTML = buttons;
    }

    function goToPage(page) {
      currentPage = page;
      renderProducts(page);
      renderPagination();
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }


    const catalogBtn = document.querySelector('.catalog-btn');
    const catalogPanel = document.getElementById('catalog-panel');

    function toggleCatalogPanel(forceOpen) {
      const willOpen = typeof forceOpen === 'boolean' ? forceOpen : !catalogPanel.classList.contains('open');
      catalogPanel.classList.toggle('open', willOpen);
      catalogBtn.setAttribute('aria-expanded', String(willOpen));
    }
    catalogBtn.addEventListener('click', () => toggleCatalogPanel());

    document.addEventListener('click', (e) => {
      if (!catalogPanel.classList.contains('open')) return;
      const isInside = catalogPanel.contains(e.target) || catalogBtn.contains(e.target);
      if (!isInside) toggleCatalogPanel(false);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && catalogPanel.classList.contains('open')) {
        toggleCatalogPanel(false);
        catalogBtn.focus();
      }
    });

    fetchProducts();

    // time
    function updateDeliveryDate() {
      var now = new Date();
      var y = now.getFullYear();
      var m = String(now.getMonth() + 1).padStart(2, "0");
      var d = String(now.getDate()).padStart(2, "0");
      var el = document.getElementById("delivery-time-text");
      if (el) el.textContent = y + "-" + m + "-" + d;
    }
    updateDeliveryDate();

    (function () {
      const icon = document.querySelector('.icons .icon-box i.fa-house');
      const homeBtn = icon ? icon.parentElement : null;
      if (!homeBtn) return;
      const goHome = () => {
        const onMain = /(^|\/)main\.html(\?|#|$)/.test(location.href);
        if (onMain) location.reload();
        else location.href = './main.html';
      };
      homeBtn.setAttribute('aria-label', '홈');
      homeBtn.setAttribute('role', 'link');
      homeBtn.addEventListener('click', e => {
        e.preventDefault();
        goHome();
      });
      homeBtn.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          goHome();
        }
      });
    })();

    // 안전한 정규식 이스케이프
    function escapeRegExp(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function applySearchFilter() {
      const urlParams = new URLSearchParams(window.location.search);
      const q = (urlParams.get("query") || "").trim().toLowerCase();
      if (!q) return;

      // 공백으로 분해된 모든 단어가 각각 '단어 경계'로 매칭될 때만 통과 (정확도↑)
      const words = q.split(/\s+/).filter(Boolean);
      filteredProducts = filteredProducts.filter((p) => {
        const hay = `${p.name} ${p.category}`.toLowerCase();
        return words.every((w) => new RegExp(`\\b${escapeRegExp(w)}\\b`, "i").test(hay));
      });
    }
  </script>
  <script defer src="../js/main.js"></script>
</body>

</html>
